plugins { id 'com.android.application' }
android {
    namespace 'dev.norihy.discordmobile'
    compileSdk 36
    buildFeatures { buildConfig true }
    bundle { language { enableSplit = false } }
    defaultConfig {
        def licenseUrl = (System.getenv('DMA_LICENSE_URL') ?: '').replaceAll('/+$', '')
        if (licenseUrl && !(licenseUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) throw new GradleException('DMA_LICENSE_URL must be an HTTPS origin')
        buildConfigField 'String', 'LICENSE_SERVER_URL', '"' + licenseUrl + '"'
        applicationId 'dev.norihy.discordmobile'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '1.4.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('DMA_STORE_FILE')) {
                storeFile file(System.getenv('DMA_STORE_FILE'))
                storePassword System.getenv('DMA_STORE_PASSWORD')
                keyAlias 'mobile'
                keyPassword System.getenv('DMA_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('DMA_STORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
