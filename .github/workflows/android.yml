name: Android and watcher checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  watcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install -r license_server/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s license_server -v
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare_worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r license_server/requirements.txt
      - run: npm ci
        working-directory: cloudflare_worker
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: cloudflare_worker
      - name: Test Worker and local D1
        working-directory: cloudflare_worker
        run: |
          printf 'DMA_ADMIN_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\n' > .dev.vars
          npx wrangler d1 migrations apply message-auto-licenses --local
          npx wrangler dev --port 8787 > /tmp/dma-worker.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8787/health; then break; fi; sleep 1; done
          python -m unittest test_integration.py -v
